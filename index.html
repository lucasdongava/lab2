<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de estudos de Laboratório de Programação II (Java): aulas, simulações interativas, exercícios e editor que executa Java no navegador.">
<meta name="theme-color" content="#ffffff">
<title>LabII - Java</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir aulas">☰</button>
    <button class="icon-btn collapse-btn" id="collapseBtn" aria-label="Recolher menu lateral" aria-expanded="true" title="Recolher/mostrar menu"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button>
    <a class="logo" id="logoHome" href="#inicio" aria-label="LabII - Java: ir para o Início"><div class="logo-mark" aria-hidden="true"><i></i></div><div>LabII - Java</div></a>
    <div class="top-prog"><span class="lbl" id="progTxt">0 de 0 aulas</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
    <button class="icon-btn code-btn" id="codeBtn" aria-label="Abrir ou fechar o editor de código" title="Editor de código">&lt;/&gt;</button>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema">◐</button>
  </header>

  <nav class="side" id="side" aria-label="Aulas"></nav>

  <main class="lesson" id="lesson"><div class="lesson-in" id="lessonIn"></div></main>

  <section class="ide" id="ide" aria-label="Editor Java">
    <div class="ide-bar">
      <div class="file"><i></i><span id="fileName">Main.java</span></div>
      <button class="ib run" id="runBtn" title="Ctrl+Enter">▶ <span class="t">Executar</span></button>
      <button class="ib" id="resetBtn" title="Voltar ao código inicial">↺ <span class="t">Reiniciar</span></button>
      <button class="ib" id="copyBtn" title="Copiar código">⧉ <span class="t">Copiar</span></button>
      <a class="ib" href="https://www.onlinegdb.com/online_java_compiler" target="_blank" rel="noopener" title="Java 100% real (cole o código lá)">↗ <span class="t">OnlineGDB</span></a>
          </div>
    <div class="editor-wrap" id="editorWrap"></div>
    <div class="keys" id="keys"></div>
    <div class="io">
      <div class="io-tabs">
        <button class="io-tab on" data-io="out">Saída</button>
        <button class="io-tab" data-io="in">Entrada (Scanner)</button>
        <span class="io-meta" id="ioMeta">Ctrl+Enter para executar</span>
      </div>
      <div class="io-body">
        <pre id="out"><span class="sys">Escreva seu código e clique em ▶ Executar.</span></pre>
        <textarea id="stdin" hidden spellcheck="false" placeholder="Digite aqui o que o programa vai ler com Scanner, um valor por linha. Ex:&#10;10&#10;5&#10;+"></textarea>
      </div>
    </div>
  </section>
  <nav class="tabbar" aria-label="Alternar entre aula e código">
    <span class="tb-ind" aria-hidden="true"></span>
    <button id="tbLesson" class="on"><i>¶</i>Aula</button>
    <button id="tbCode"><i>‹/›</i>Código</button>
    <button class="tb-run" id="tbRun">▶ Executar</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- CodeMirror 5 (editor de código) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<!-- Aplicação -->
<script src="js/conteudo.js"></script>
<script src="js/java-lite.js"></script>
<script src="js/visualizacoes.js"></script>
<script src="js/modulo-eclipse.js"></script>
<script src="js/progresso.js"></script>
<script src="js/resumo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
