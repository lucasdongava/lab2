<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de estudos de Laboratório de Programação II (Java): aulas, simulações interativas, exercícios e editor que executa Java no navegador.">
<meta name="theme-color" content="#ffffff">
<title>LabII - Java</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir aulas" data-i18n-attr="aria-label:openLessonsAria">☰</button>
    <button class="icon-btn collapse-btn" id="collapseBtn" aria-label="Recolher menu lateral" aria-expanded="true" title="Recolher/mostrar menu" data-i18n-attr="title:collapseTitle"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9.5 4v16"/></svg></button>
    <a class="logo" id="logoHome" href="#inicio" aria-label="LabII - Java: ir para o Início" data-i18n-attr="aria-label:logoAria"><div class="logo-mark" aria-hidden="true"><i></i></div><div data-i18n="docTitle">LabII - Java</div></a>
    <div class="top-prog"><span class="lbl" id="progTxt">0 de 0 aulas</span><div class="bar"><i id="progBar" style="width:0"></i></div></div>
    <button class="icon-btn code-btn" id="codeBtn" aria-label="Abrir ou fechar o editor de código" title="Editor de código" data-i18n-attr="aria-label:codeBtnAria,title:codeBtnTitle">&lt;/&gt;</button>
    <div class="lang" id="lang">
      <button class="icon-btn lang-btn" id="langBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Idioma" data-i18n-attr="aria-label:langAria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.7 3.8 5.7 3.8 9S14.5 18.3 12 21c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></svg></button>
      <div class="lang-menu" id="langMenu" role="menu">
        <button role="menuitemradio" data-l="pt" aria-checked="true"><span>Português (BR)</span><i aria-hidden="true">✓</i></button>
        <button role="menuitemradio" data-l="en" aria-checked="false"><span>English</span><i aria-hidden="true">✓</i></button>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Alternar tema" data-i18n-attr="aria-label:themeAria">◐</button>
  </header>

  <nav class="side" id="side" aria-label="Aulas" data-i18n-attr="aria-label:sideNavAria"></nav>

  <main class="lesson" id="lesson"><div class="lesson-in" id="lessonIn"></div></main>

  <section class="ide" id="ide" aria-label="Editor Java" data-i18n-attr="aria-label:ideAria">
    <div class="ide-bar">
      <div class="file"><i></i><span id="fileName">Main.java</span></div>
      <button class="ib run" id="runBtn" title="Ctrl+Enter">▶ <span class="t" data-i18n="run">Executar</span></button>
      <button class="ib" id="resetBtn" title="Voltar ao código inicial" data-i18n-attr="title:resetTitle">↺ <span class="t" data-i18n="reset">Reiniciar</span></button>
      <button class="ib" id="copyBtn" title="Copiar código" data-i18n-attr="title:copyTitle">⧉ <span class="t" data-i18n="copy">Copiar</span></button>
      <a class="ib" href="https://www.onlinegdb.com/online_java_compiler" target="_blank" rel="noopener" title="Java 100% real (cole o código lá)" data-i18n-attr="title:gdbTitle">↗ <span class="t">OnlineGDB</span></a>
          </div>
    <div class="editor-wrap" id="editorWrap"></div>
    <div class="keys" id="keys"></div>
    <div class="io">
      <div class="io-tabs">
        <button class="io-tab on" data-io="out" data-i18n="tabOut">Saída</button>
        <button class="io-tab" data-io="in" data-i18n="tabIn">Entrada (Scanner)</button>
        <span class="io-meta" id="ioMeta" data-i18n="ctrlEnter">Ctrl+Enter para executar</span>
      </div>
      <div class="io-body">
        <pre id="out"><span class="sys">Escreva seu código e clique em ▶ Executar.</span></pre>
        <textarea id="stdin" hidden spellcheck="false" data-i18n-attr="placeholder:stdinPh" placeholder="Digite aqui o que o programa vai ler com Scanner, um valor por linha. Ex:&#10;10&#10;5&#10;+"></textarea>
      </div>
    </div>
  </section>
  <nav class="tabbar" aria-label="Alternar entre aula e código" data-i18n-attr="aria-label:tabbarAria">
    <span class="tb-ind" aria-hidden="true"></span>
    <button id="tbLesson" class="on"><i>¶</i><span data-i18n="tbLesson">Aula</span></button>
    <button id="tbCode"><i>‹/›</i><span data-i18n="tbCode">Código</span></button>
    <button class="tb-run" id="tbRun" data-i18n="tbRun">▶ Executar</button>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="toast" id="toast"></div>
</div>

<!-- CodeMirror 5 (editor de código) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/runmode/runmode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<!-- Aplicação -->
<script src="js/i18n.js"></script>
<script src="js/conteudo.js"></script>
<script src="js/java-lite.js"></script>
<script src="js/visualizacoes.js"></script>
<script src="js/modulo-eclipse.js"></script>
<script src="js/progresso.js"></script>
<script src="js/resumo.js"></script>
<script>
/* modo English: sobrepõe os dados em português (js/en/*) antes de iniciar o app */
if (LANG === "en") ["conteudo", "modulo-eclipse", "visualizacoes", "resumo"].forEach(function (n) { document.write("<script src=\"js/en/" + n + ".js\"><\/script>"); });
applyStatic();
</script>
<script src="js/app.js"></script>
</body>
</html>
